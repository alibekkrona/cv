services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_pattern_dna_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pattern:pattern_demo_password@postgres:5432/pattern
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3200:8000"

  postgres:
    image: postgres:16
    container_name: portfolio_pattern_dna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pattern
      POSTGRES_USER: pattern
      POSTGRES_PASSWORD: pattern_demo_password
    ports:
      - "5448:5432"
    volumes:
      - pattern_demo_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pattern -d pattern"]
      interval: 5s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:4
    container_name: portfolio_pattern_dna_adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8281:8080"

volumes:
  pattern_demo_data:
