services:
  postgres:
    image: postgres:16
    container_name: pattern-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pattern}
      POSTGRES_USER: ${POSTGRES_USER:-pattern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pattern_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pattern_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pattern} -d ${POSTGRES_DB:-pattern}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pattern:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pattern-pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pattern:pattern_dev_password@postgres:5432/pattern}
      PATTERN_ROOT: /workspace/pattern
      DNA_ROOT: /workspace/DNA
    working_dir: /workspace/pattern
    volumes:
      - .:/workspace/pattern
      - ../DNA:/workspace/DNA:ro
      - /mnt/d/bearingknowledge_data:/mnt/d/bearingknowledge_data:ro
    command: ["sleep", "infinity"]

  adminer:
    image: adminer:4
    container_name: pattern-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pattern-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pattern:pattern_dev_password@postgres:5432/pattern}
    working_dir: /workspace/pattern
    volumes:
      - .:/workspace/pattern
      - ../DNA:/workspace/DNA:ro
      - /mnt/d/bearingknowledge_data:/mnt/d/bearingknowledge_data:ro
    ports:
      - "8090:8000"
    command: ["python", "web/app.py"]

  viewer:
    image: node:20
    container_name: pattern-viewer
    depends_on:
      - dashboard
    working_dir: /workspace/pattern/viewer
    volumes:
      - .:/workspace/pattern
    ports:
      - "5173:5173"
    command: ["sh", "-lc", "npm install && npm run dev"]

volumes:
  pattern_postgres_data:
